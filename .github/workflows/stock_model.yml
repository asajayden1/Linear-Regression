name: Update Stock Model

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

jobs:
  update-model:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install alpaca-py python-dotenv pandas scikit-learn numpy

      - name: Create stock database
        env:
          APCA_API_KEY: ${{ secrets.APCA_API_KEY }}
          APCA_API_SECRET: ${{ secrets.APCA_API_SECRET }}
        run: python create_model_database.py

      - name: Run linear regression
        run: python linear_regression.py